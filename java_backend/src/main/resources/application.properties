server.port=8080
server.error.include-message=always

# Python CNN API
python.api.url=http://localhost:5000

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# H2 database (file based, so history survives restarts)
spring.datasource.url=jdbc:h2:file:./data/weeddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# thumbnails are sent as form fields, so allow slightly larger form data
server.tomcat.max-http-form-post-size=2MB
